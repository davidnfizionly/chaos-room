<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chaos Room Simulator - Architecture</title>
<style>
  :root { --ink: #232F3E; --orange: #ED7100; --region: #00A4A6; --grey: #7D8998; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; font-family: "Amazon Ember", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #canvas { position: relative; width: 1800px; height: 1000px; background: #fff; overflow: hidden; }
  .box { position: absolute; border: 2px solid; }
  .box > .title { position: absolute; top: 6px; left: 10px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  .box > .title img { width: 32px; height: 32px; }
  .cloud { border-color: var(--ink); }
  .cloud > .title { top: 0; left: 0; background: var(--ink); color: #fff; padding: 0 12px 0 0; height: 36px; }
  .cloud > .title img { width: 36px; height: 36px; }
  .account { border-color: var(--orange); }
  .region { border: 2px dashed var(--region); }
  .region > .title { color: #00777A; }
  .local { border-color: var(--grey); }
  .node { position: absolute; width: 200px; margin-left: -100px; text-align: center; }
  .node img { width: 64px; height: 64px; display: block; margin: 0 auto; }
  .node span { display: block; margin-top: 6px; font-size: 20px; line-height: 1.15; }
  .step { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #000; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  svg { position: absolute; inset: 0; pointer-events: none; }
  svg polyline { fill: none; stroke: #000; stroke-width: 1.6; }
</style>
</head>
<body>
<div id="canvas">

  <!-- Containers -->
  <div class="box local" style="left:40px; top:170px; width:300px; height:740px;"><div class="title">Local machine (Nairobi)</div></div>
  <div class="box cloud" style="left:380px; top:25px; width:1390px; height:950px;"><div class="title"><img src="icons/group-aws-cloud.svg" alt="">AWS Cloud</div></div>
  <div class="box account" style="left:405px; top:75px; width:1340px; height:875px;"><div class="title">AWS account</div></div>
  <div class="box region" style="left:430px; top:125px; width:1290px; height:800px;"><div class="title"><img src="icons/group-region.svg" alt="">us-east-1</div></div>

  <!-- Nodes: top = center y - 32 -->
  <div class="node" style="left:190px; top:268px;"><img src="icons/gear.svg" alt=""><span>Simulator<br>(3 devices)</span></div>
  <div class="node" style="left:190px; top:768px;"><img src="icons/client.svg" alt=""><span>React dashboard</span></div>

  <div class="node" style="left:590px; top:268px;"><img src="icons/Arch_AWS-IoT-Core_64.svg" alt=""><span>IoT Core (MQTT)</span></div>
  <div class="node" style="left:900px; top:268px;"><img src="icons/Res_AWS-IoT-Rule_48.svg" alt=""><span>IoT Rules</span></div>
  <div class="node" style="left:1210px; top:268px;"><img src="icons/Arch_AWS-Step-Functions_64.svg" alt=""><span>Express workflows</span></div>
  <div class="node" style="left:1520px; top:268px; width:240px; margin-left:-120px;"><img src="icons/Arch_AWS-Lambda_64.svg" alt=""><span>Action Lambdas<br>(fix, alarm, lockdown)</span></div>

  <div class="node" style="left:900px; top:528px;"><img src="icons/Arch_Amazon-DynamoDB_64.svg" alt=""><span>State table</span></div>
  <div class="node" style="left:1210px; top:528px;"><img src="icons/Arch_Amazon-DynamoDB_64.svg" alt=""><span>Incident log</span></div>
  <div class="node" style="left:1520px; top:528px;"><img src="icons/Arch_Amazon-CloudWatch_64.svg" alt=""><span>CloudWatch Logs</span></div>

  <div class="node" style="left:590px; top:768px;"><img src="icons/Arch_Amazon-API-Gateway_64.svg" alt=""><span>HTTP API</span></div>
  <div class="node" style="left:900px; top:768px;"><img src="icons/Arch_AWS-Lambda_64.svg" alt=""><span>API Lambdas</span></div>

  <!-- Steps -->
  <div class="step" style="left:122px; top:252px;">1</div>
  <div class="step" style="left:832px; top:252px;">2</div>
  <div class="step" style="left:1142px; top:252px;">3</div>
  <div class="step" style="left:1142px; top:512px;">4</div>
  <div class="step" style="left:1452px; top:252px;">5</div>
  <div class="step" style="left:522px; top:252px;">6</div>
  <div class="step" style="left:1452px; top:512px;">7</div>
  <div class="step" style="left:122px; top:752px;">8</div>
  <div class="step" style="left:522px; top:752px;">9</div>
  <div class="step" style="left:938px; top:752px;">10</div>

  <svg width="1800" height="1000" viewBox="0 0 1800 1000">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
      </marker>
    </defs>
    <!-- 1 telemetry up, commands down, over MQTT -->
    <polyline points="226,300 554,300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- 2 IoT Core to the rules; live-state rule to the state table -->
    <polyline points="626,300 864,300" marker-end="url(#arrow)"/>
    <polyline points="900,372 900,524" marker-end="url(#arrow)"/>
    <!-- 3 fault rule starts the Express workflow -->
    <polyline points="936,300 1174,300" marker-end="url(#arrow)"/>
    <!-- 4 workflow writes the incident log and takes the lock in the state table -->
    <polyline points="1210,372 1210,524" marker-end="url(#arrow)"/>
    <polyline points="1210,440 1050,440 1050,560 936,560" marker-end="url(#arrow)"/>
    <circle cx="1210" cy="440" r="4" fill="#000"/>
    <!-- 5 workflow invokes the action Lambdas -->
    <polyline points="1246,300 1484,300" marker-end="url(#arrow)"/>
    <!-- 6 action Lambdas publish the command back through IoT Core -->
    <polyline points="1520,264 1520,195 590,195 590,264" marker-end="url(#arrow)"/>
    <!-- 7 workflow and Lambda logs -->
    <polyline points="1520,396 1520,524" marker-end="url(#arrow)"/>
    <polyline points="1210,440 1380,440 1380,560 1484,560" marker-end="url(#arrow)"/>
    <!-- 8 dashboard polls the HTTP API -->
    <polyline points="226,810 554,810" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- 9 HTTP API to the API Lambdas -->
    <polyline points="626,810 864,810" marker-end="url(#arrow)"/>
    <!-- 10 API Lambdas read and reset the state table, read the incident log, publish sabotage commands -->
    <polyline points="900,632 900,764" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline points="1210,632 1210,800 936,800" marker-end="url(#arrow)"/>
    <polyline points="864,780 750,780 750,330 626,330" marker-end="url(#arrow)"/>
  </svg>
</div>
</body>
</html>
